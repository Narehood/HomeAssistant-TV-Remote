name: Bug report
description: Report a reproducible problem in the fork
title: "[Bug]: "
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        This form reports to Narehood/HomeAssistant-TV-Remote, the independently maintained Firemote fork. See [setup and troubleshooting](https://github.com/Narehood/HomeAssistant-TV-Remote/blob/main/docs/INSTALLATION.md). Include observed results; do not post credentials or private addresses.
  - type: input
    id: card-version
    attributes:
      label: Card version
      description: "Version shown by HACS or the card. Include the selected tag/commit for development versions."
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: "Include the exact Core/frontend version."
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS custom repository
        - Manual release bundle
        - Development build
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device and integration
      description: "Include manufacturer, model, firmware, integration name, control_mode, and how the media player and remote entities are paired."
    validations:
      required: true
  - type: textarea
    id: yaml
    attributes:
      label: Minimal card YAML
      description: "Remove credentials and personal information."
      render: yaml
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed result
      description: "Give numbered reproduction/test steps, expected behavior, actual behavior, and relevant action or browser errors."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Screenshots, relevant errors, and full historical upstream issue URLs if applicable."
    validations:
      required: false
