name: Xiaomi device support request
description: Request or correct a Xiaomi device preset
title: "[Xiaomi support]: "
labels: ['New Device Support', 'enhancement']
body:
  - type: markdown
    attributes:
      value: |
        This form reports to Narehood/HomeAssistant-TV-Remote, the independently maintained Firemote fork. See [setup and troubleshooting](https://github.com/Narehood/HomeAssistant-TV-Remote/blob/main/docs/INSTALLATION.md). Include observed results; do not post credentials or private addresses.
  - type: input
    id: card-version
    attributes:
      label: Card version
      description: "Version shown by HACS or the card. Include the selected tag/commit for development versions."
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: "Include the exact Core/frontend version."
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS custom repository
        - Manual release bundle
        - Development build
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device and integration
      description: "Include manufacturer, model, firmware, integration name, control_mode, and how the media player and remote entities are paired."
    validations:
      required: true
  - type: textarea
    id: preset
    attributes:
      label: Device preset and compatibility observations
      description: "State family/model preset, compatibility_mode values tried, buttons tested, and their results. Unknown or no working mode is a valid answer."
    validations:
      required: true
  - type: textarea
    id: input-details
    attributes:
      label: Device input details
      description: "For Android/Fire with ADB, run dumpsys input using the ADB action and include relevant adb_response devices/paths. See collecting-device-information in the installation guide. State not applicable for other integrations."
      render: text
    validations:
      required: false
  - type: textarea
    id: yaml
    attributes:
      label: Minimal card YAML
      description: "Remove credentials and personal information."
      render: yaml
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed result
      description: "Give numbered reproduction/test steps, expected behavior, actual behavior, and relevant action or browser errors."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Screenshots, relevant errors, and full historical upstream issue URLs if applicable."
    validations:
      required: false
