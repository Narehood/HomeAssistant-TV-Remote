name: App shortcut request
description: Request or correct a platform-specific app shortcut
title: "[App shortcut]: "
labels: ['New App Shortcut', 'enhancement']
body:
  - type: markdown
    attributes:
      value: |
        This form reports to Narehood/HomeAssistant-TV-Remote, the independently maintained Firemote fork. See [setup and troubleshooting](https://github.com/Narehood/HomeAssistant-TV-Remote/blob/main/docs/INSTALLATION.md). Include observed results; do not post credentials or private addresses.
  - type: input
    id: card-version
    attributes:
      label: Card version
      description: "Version shown by HACS or the card. Include the selected tag/commit for development versions."
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: "Include the exact Core/frontend version."
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS custom repository
        - Manual release bundle
        - Development build
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device and integration
      description: "Include manufacturer, model, firmware, integration name, control_mode, and how the media player and remote entities are paired."
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App name and version
      description: "Include the exact app name and app version."
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Country or region and device language
      description: "App availability and launch identifiers may differ by region or language."
    validations:
      required: true
  - type: input
    id: store
    attributes:
      label: Official store URL
      description: "Link to the relevant app store listing or the publisher download page."
    validations:
      required: false
  - type: textarea
    id: identifier
    attributes:
      label: Observed launch information
      description: "Follow the collecting-device-information section in the installation guide. Include Android package/activity or deep link, Apple TV source_list, or Roku app_id/app_name/source. State if not available."
    validations:
      required: true
  - type: textarea
    id: yaml
    attributes:
      label: Minimal card YAML
      description: "Remove credentials and personal information."
      render: yaml
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed result
      description: "Give numbered reproduction/test steps, expected behavior, actual behavior, and relevant action or browser errors."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Screenshots, relevant errors, and full historical upstream issue URLs if applicable."
    validations:
      required: false
