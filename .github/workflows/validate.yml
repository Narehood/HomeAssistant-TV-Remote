name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and regression checks
    if: github.repository == 'Narehood/HomeAssistant-TV-Remote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate and build the card
        run: npm run check
      - name: Install browser for artifact validation
        run: npx playwright install --with-deps chromium
      - name: Validate the release artifact in a browser
        run: npm run test:browser

  hacs:
    name: HACS dashboard metadata
    if: github.repository == 'Narehood/HomeAssistant-TV-Remote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate HACS plugin repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main verified 2026-10-22
        with:
          category: plugin
          repository: Narehood/HomeAssistant-TV-Remote
          comment: 'false'
          github_token: ${{ secrets.GITHUB_TOKEN }}
